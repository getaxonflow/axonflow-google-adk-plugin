[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axonflow-google-adk-plugin"
version = "1.2.0"
description = "AxonFlow governance plugin for Google Agent Development Kit (ADK)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AxonFlow", email = "hello@getaxonflow.com"},
]
keywords = ["axonflow", "google-adk", "adk", "ai-governance", "llm", "policy", "compliance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    # The `mcp` extra is what `axonflow_mcp_toolset` runs on. google-adk keeps
    # the `mcp` SDK optional and owns its supported range (`mcp>=1.24,<2` at
    # 2.0.0 through 2.8.0); asking for the extra inherits that range instead of
    # this package guessing one. Without it, an install of this plugin had no
    # `mcp` at all, and the only thing standing in was an unpinned side-install
    # in the release e2e, which resolved `mcp` 2.x and broke the toolset.
    "google-adk[mcp]>=2.0.0",
    "axonflow>=9.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://getaxonflow.com"
Documentation = "https://docs.getaxonflow.com/docs/integration/google-adk"
Repository = "https://github.com/getaxonflow/axonflow-google-adk-plugin"
Changelog = "https://github.com/getaxonflow/axonflow-google-adk-plugin/blob/main/CHANGELOG.md"
Issues = "https://github.com/getaxonflow/axonflow-google-adk-plugin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["axonflow_adk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
