name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        # PINNED. An unpinned `pip install ruff` means a new ruff release
        # reds every PR in this repo for rules nobody in the PR touched - which
        # is exactly what happened when 0.16 added PYI034/PYI036/RUF022 and
        # main went red without a code change. A bump is now a deliberate edit.
        run: pip install 'ruff>=0.16,<0.17'

      - name: Lint
        run: ruff check axonflow_adk/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  sdk-wire-contract:
    # Proves the caller_name dual-send actually reaches the audit wire body,
    # against the REAL axonflow SDK serializer (tests/ stubs the SDK type).
    # caller_name is unreleased on PyPI, so install the caller_name-capable
    # SDK from a pinned git build; swap for the PyPI release (and bump the
    # `axonflow` runtime pin) once that SDK ships. Nothing here skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plugin + caller_name-capable SDK (pinned git build)
        run: |
          pip install -e ".[dev]"
          pip install --force-reinstall --no-deps \
            "axonflow @ git+https://github.com/getaxonflow/axonflow-sdk-python.git@5d1809e"

      - name: Verify caller_name reaches the audit wire body
        run: pytest tests-sdk-wire/ -v --tb=short

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify wheel contents
        run: |
          pip install dist/*.whl
          python -c "from axonflow_adk import AxonFlowPlugin, __version__; print(f'OK: {__version__}')"
