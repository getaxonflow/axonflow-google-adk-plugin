name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        # PINNED. An unpinned `pip install ruff` means a new ruff release
        # reds every PR in this repo for rules nobody in the PR touched - which
        # is exactly what happened when 0.16 added PYI034/PYI036/RUF022 and
        # main went red without a code change. A bump is now a deliberate edit.
        run: pip install 'ruff>=0.16,<0.17'

      - name: Lint
        run: ruff check axonflow_adk/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  sdk-wire-contract:
    # Proves the plugin against the REAL axonflow SDK (tests/ stubs it): the
    # caller_name dual-send reaches the audit wire body, and the failure
    # posture reads the exceptions the SDK actually raises for each platform
    # answer, with a local stub server as the platform. The SDK is the one the
    # plugin's own dependency (axonflow>=9.3.0) resolves, which is what a user
    # installs. This job used to force-install a git build (5d1809e, which
    # reports 8.5.1) that predates the per-call extra_headers the plugin
    # passes, so no governed check could run on it. Nothing here skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plugin + the SDK its dependency resolves
        run: |
          pip install -e ".[dev]"
          python -c 'from importlib.metadata import version as v; print("axonflow", v("axonflow"))'

      - name: Verify the plugin against the real SDK
        run: pytest tests-sdk-wire/ -v --tb=short

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify wheel contents
        run: |
          pip install dist/*.whl
          python -c "from axonflow_adk import AxonFlowPlugin, __version__; print(f'OK: {__version__}')"
